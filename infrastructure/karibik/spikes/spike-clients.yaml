# Spike A (docs/superpowers/spikes/2026-11-beg-previews/README.md): Test-Clients gegen Keycloak "beg".
# Aufraeumen = Datei aus kustomization.yaml entfernen und pushen; Flux prunt die CRs, der Operator loescht die
# Clients in Keycloak (das ist zugleich Frage 3 des Spikes).
apiVersion: v1
kind: Secret
metadata:
  name: spike-crm-client
  namespace: keycloak
  labels:
    operator.keycloak.org/kind: KeycloakOIDCClient
type: Opaque
stringData:
  client-secret: spike-only-secret-delete-after-test-0001
---
# Ergebnis 2026-11-25: ohne auth -> publicClient=true, erbt Default-Scope beg-roles
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: spike-portal
  namespace: keycloak
spec:
  keycloakCRName: beg
  realm: beg
  client:
    # Spike A: ohne enabled legt der Operator den Client DEAKTIVIERT an (invalid_client beim Token)
    enabled: true
    loginFlows: [STANDARD]
    redirectUris: ["https://beg-mr-0.hummler.com/*"]
    webOrigins: ["+"]
---
# Ergebnis 2026-11-25: serviceAccountRoles nimmt nur Realm-Rollen ("realm-management/manage-users",
# "realm-management:manage-users", "manage-users" -> 400 "role does not exist"; "portal-user" ok).
# Jetzt mit der zusammengesetzten Realm-Rolle aus dem Realm-Setup-Job.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: spike-crm
  namespace: keycloak
spec:
  keycloakCRName: beg
  realm: beg
  client:
    # Spike A: ohne enabled legt der Operator den Client DEAKTIVIERT an (invalid_client beim Token)
    enabled: true
    loginFlows: [STANDARD, SERVICE_ACCOUNT]
    redirectUris: ["https://beg-mr-0.hummler.com/*"]
    auth:
      method: client-secret
      secretRef:
        name: spike-crm-client
        key: client-secret
    serviceAccountRoles:
      - beg-preview-user-admin
