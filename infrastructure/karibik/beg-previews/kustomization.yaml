apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Steuerung der Preview-Umgebungen von beg-verwaltung (Doku 4j): InputProvider (MRs + main), ResourceSet,
# RBAC, Admission-Policies, Zugangsdaten. Die Vorlage der Previews selbst liegt im App-Repo unter deployment/preview/.
# Achtung postBuild: Flux ersetzt hier ${...} aus cluster-secrets (PREVIEW_CLIENT_SECRET_SEED im ResourceSet).
resources:
  - namespace.yaml
  - rbac.yaml
  - admission-policy.yaml
  # gitlab-token, registry-pull. Bearbeiten: sops infrastructure/karibik/beg-previews/secrets-encrypted.yaml
  - secrets-encrypted.yaml
  - input-providers.yaml
  - resourceset.yaml
