# Quellen der Previews (Doku 4j):
# - beg-merge-requests: alle offenen MRs von einfach-genossenschaft/beg-verwaltung, hoechstens 8 gleichzeitig,
#   Exportiert pro MR id (MR-Nummer), sha, branch, author, title.
#   Abbau ohne Merge: "[no-preview]" in den MR-Titel (resourceset.yaml). Label "preview::pause" friert eine Preview
#   ein (skip.labels pausiert nur die Aktualisierung des Inputs, entfernt ihn nicht).
# - beg-main: der Branch main -> dauerhafte Preview beg-main (Ziel von test_e2e nach dem Merge).
# defaultValues.kind unterscheidet beide im ResourceSet (resourceset.yaml).
# Takt: alle 2 Minuten (kein Webhook-Receiver; bei Bedarf Flux-Receiver type gitlab ergaenzen).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: beg-merge-requests
  namespace: beg-previews
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "2m"
spec:
  type: GitLabMergeRequest
  url: https://gitlab.com/einfach-genossenschaft/beg-verwaltung
  secretRef:
    name: gitlab-token
  filter:
    limit: 8
  skip:
    labels:
      - "preview::pause"
  defaultValues:
    kind: mr
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: beg-main
  namespace: beg-previews
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "2m"
spec:
  type: GitLabBranch
  url: https://gitlab.com/einfach-genossenschaft/beg-verwaltung
  secretRef:
    name: gitlab-token
  filter:
    includeBranch: "^main$"
  defaultValues:
    kind: main
    # GitLabBranch exportiert kein title; das Template liest inputs.title (Opt-out "[no-preview]") und bricht
    # ohne den Schluessel fuer ALLE Inputs ab ("map has no entry for key title").
    title: ""
