# ValidatingAdmissionPolicies der Preview-Steuerung (Doku 4j). RBAC kann Namen und Feldinhalte nicht
# einschraenken – das uebernehmen diese Policies, jeweils nur fuer die ServiceAccounts der Previews:
#
# 1. ResourceSet-SA darf nur Namespaces beg-mr-<n>/beg-main anlegen/aendern/loeschen
# 2. ResourceSet-SA darf in keycloak nur Secrets beg-<id>-crm-client schreiben
# 3. Manifeste aus MR-Branches (SA beg-<id>-keycloak) duerfen nur die Clients IHRER Preview (beg-<id>-crm/-portal)
#    fuer Instanz/Realm beg mit Redirects auf den eigenen Host und erlaubten Service-Account-Rollen anlegen
# 4. Manifeste aus MR-Branches (SA beg-<id>-app) duerfen Ingresses nur fuer den eigenen Host anlegen
# 5. ResourceSet-SA darf RoleBindings nur in Preview-Namespaces bzw. keycloak, nur auf die vorgesehenen Rollen und
#    nur fuer die vorgesehenen ServiceAccounts anlegen (sonst koennte es sich selbst Secret-Rechte geben)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: beg-preview-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: resourceset-sa
      expression: request.userInfo.username == 'system:serviceaccount:beg-previews:beg-previews'
  validations:
    - expression: >-
        (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name).matches('^beg-(mr-[0-9]+|main)$')
      message: "beg-previews darf nur Namespaces beg-mr-<n> oder beg-main verwalten"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: beg-preview-namespaces
spec:
  policyName: beg-preview-namespaces
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: beg-preview-keycloak-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: keycloak
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: resourceset-sa
      expression: request.userInfo.username == 'system:serviceaccount:beg-previews:beg-previews'
  validations:
    - expression: >-
        (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name).matches('^beg-(mr-[0-9]+|main)-crm-client$')
      message: "beg-previews darf in keycloak nur Secrets beg-<id>-crm-client verwalten"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: beg-preview-keycloak-secrets
spec:
  policyName: beg-preview-keycloak-secrets
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: beg-preview-keycloak-clients
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["k8s.keycloak.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["keycloakoidcclients"]
  matchConditions:
    - name: preview-keycloak-sa
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:beg-previews:beg-') &&
        request.userInfo.username.endsWith('-keycloak')
  variables:
    # system:serviceaccount:beg-previews:beg-<id>-keycloak -> <id>
    - name: sa
      expression: request.userInfo.username.split(':')[3]
    - name: id
      expression: variables.sa.substring(4, size(variables.sa) - 9)
    # Erlaubte Origins der Preview: portal-<id>, crm-<id>; beg-<id> nur fuer den Uebergang (alte Branches mit
    # einem Host) – entfernen, wenn kein solcher MR mehr offen ist
    - name: origins
      expression: >-
        ['portal-', 'crm-', 'beg-'].map(p, 'https://' + p + variables.id + '.hummler.com')
    # spec.client ist im CRD Pflichtfeld
    - name: client
      expression: object.spec.client
    # Erlaubte Service-Account-Rollen: serviceAccountRoles nimmt nur Realm-Rollen (Spike A 2026-11-25); die
    # Nutzerverwaltung steckt in der zusammengesetzten Rolle beg-preview-user-admin (Realm-Setup-Job).
    - name: allowedRoles
      expression: "['beg-preview-user-admin']"
  validations:
    - expression: variables.id.matches('^(mr-[0-9]+|main)$')
      message: "unerwarteter ServiceAccount-Name"
    - expression: object.spec.keycloakCRName == 'beg'
      message: "Preview-Clients nur fuer die Keycloak-Instanz beg"
    - expression: object.spec.realm == 'beg'
      message: "Preview-Clients nur im Realm beg"
    # Ohne enabled legt der Operator den Client deaktiviert an (Spike A 2026-11-25) – sonst stilles invalid_client
    - expression: has(variables.client.enabled) && variables.client.enabled == true
      message: "Preview-Clients brauchen client.enabled: true (Operator-Default ist deaktiviert)"
    - expression: object.metadata.name in ['beg-' + variables.id + '-crm', 'beg-' + variables.id + '-portal']
      message: "Nur die Clients der eigenen Preview: beg-<id>-crm / beg-<id>-portal"
    - expression: >-
        !has(variables.client.redirectUris) ||
        variables.client.redirectUris.all(u, variables.origins.exists(o, u.startsWith(o + '/')))
      message: "Redirect-URIs nur auf die eigenen Preview-Hosts"
    - expression: >-
        !has(variables.client.webOrigins) ||
        variables.client.webOrigins.all(o, o == '+' || o in variables.origins)
      message: "Web-Origins nur '+' oder die eigenen Preview-Hosts"
    - expression: >-
        !has(variables.client.serviceAccountRoles) ||
        variables.client.serviceAccountRoles.all(r, r in variables.allowedRoles)
      message: "Service-Account-Rollen nur aus der Allowlist (Nutzerverwaltung)"
    - expression: >-
        !has(variables.client.auth) || !has(variables.client.auth.secretRef) ||
        variables.client.auth.secretRef.name == object.metadata.name + '-client'
      message: "Client-Secret nur aus dem Secret <client-name>-client"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: beg-preview-keycloak-clients
spec:
  policyName: beg-preview-keycloak-clients
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: beg-preview-ingress-hosts
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  matchConditions:
    - name: preview-app-sa
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:beg-previews:beg-') &&
        request.userInfo.username.endsWith('-app')
  variables:
    # Namespace beg-<id> -> erlaubte Hosts portal-<id>, crm-<id>; beg-<id> nur fuer den Uebergang (alte Branches)
    - name: hosts
      expression: >-
        ['portal-', 'crm-', 'beg-'].map(p, p + request.namespace.substring(4) + '.hummler.com')
  validations:
    # Ohne Rules griffe ein defaultBackend fuer beliebige Hosts - fuer Previews nicht erlaubt
    - expression: "!has(object.spec.defaultBackend)"
      message: "Preview-Ingress ohne defaultBackend"
    - expression: >-
        (!has(object.spec.rules) ||
         object.spec.rules.all(r, has(r.host) && r.host in variables.hosts)) &&
        (!has(object.spec.tls) ||
         object.spec.tls.all(t, !has(t.hosts) || t.hosts.all(h, h in variables.hosts)))
      message: "Preview-Ingress nur fuer die eigenen Hosts portal-<id>/crm-<id>.hummler.com"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: beg-preview-ingress-hosts
spec:
  policyName: beg-preview-ingress-hosts
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: beg-preview-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: resourceset-sa
      expression: request.userInfo.username == 'system:serviceaccount:beg-previews:beg-previews'
  variables:
    - name: rb
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: ns
      expression: request.namespace
  validations:
    - expression: >-
        (variables.ns.matches('^beg-(mr-[0-9]+|main)$') &&
         variables.rb.roleRef.kind == 'ClusterRole' &&
         variables.rb.roleRef.name in ['beg-preview-app', 'beg-preview-platform'] &&
         variables.rb.subjects.all(s, s.kind == 'ServiceAccount' && s.namespace == 'beg-previews' &&
           (s.name == 'beg-previews' || s.name == variables.ns + '-app')))
        ||
        (variables.ns == 'keycloak' &&
         variables.rb.metadata.name.matches('^beg-(mr-[0-9]+|main)-keycloak$') &&
         variables.rb.roleRef.kind == 'Role' &&
         variables.rb.roleRef.name == 'beg-preview-keycloak' &&
         variables.rb.subjects.all(s, s.kind == 'ServiceAccount' && s.namespace == 'beg-previews' &&
           s.name == variables.rb.metadata.name))
      message: "beg-previews darf RoleBindings nur fuer Preview-Namespaces/keycloak mit den vorgesehenen Rollen und SAs anlegen"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: beg-preview-rolebindings
spec:
  policyName: beg-preview-rolebindings
  validationActions: [Deny]
