# Preview-Umgebungen von beg-verwaltung (Doku 4j, Design docs/superpowers/specs/2026-11-25-beg-mr-previews-design.md).
# Pro Input (offener MR bzw. main) entsteht eine Preview mit ID mr-<iid> bzw. main:
#   Namespace beg-<id>, Host beg-<id>.hummler.com, Clients beg-<id>-crm / beg-<id>-portal in Keycloak "beg".
# Abbau: MR gemerged/geschlossen ODER "[no-preview]" im MR-Titel -> der Input rendert nichts mehr, der Operator
# raeumt ab: erst die Kustomizations (die prunen Deployments und KeycloakOIDCClients -> Operator loescht den Client
# in Keycloak), dann Namespace, Secrets, RBAC. Label "preview::pause" friert eine Preview nur ein (skip.labels).
#
# Templates: << >> (Flux Operator). ${PREVIEW_CLIENT_SECRET_SEED} ersetzt Flux beim postBuild (cluster-secrets):
# client-secret = sha256("<seed>/<id>") – stabil solange der MR offen ist, eindeutig pro Preview, nicht im Git.
#
# Jeder Step beginnt mit demselben Kopf: Preview-ID ableiten, Opt-out pruefen.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: beg-previews
  namespace: beg-previews
spec:
  serviceAccountName: beg-previews
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: beg-merge-requests
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: beg-main
  steps:
    # 1. Namespace + ServiceAccounts + RBAC
    - name: namespace
      timeout: 2m
      resourcesTemplate: |
        <<- $id := "main" ->>
        <<- if eq inputs.kind "mr" ->><<- $id = printf "mr-%v" inputs.id ->><<- end ->>
        <<- if not (contains "[no-preview]" (default "" inputs.title)) >>
        apiVersion: v1
        kind: Namespace
        metadata:
          name: beg-<< $id >>
          labels:
            app.kubernetes.io/part-of: beg-preview
            beg-preview/id: "<< $id >>"
            # baseline: App-Images (amazoncorretto, nginx) laufen als root; privileged/hostPath bleiben verboten
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/enforce-version: v1.31
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/warn-version: v1.31
          annotations:
            beg-preview/branch: << inputs.branch | quote >>
            beg-preview/commit: "sha-<< inputs.sha >>"
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: beg-<< $id >>-app
          namespace: beg-previews
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: beg-<< $id >>-keycloak
          namespace: beg-previews
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: beg-preview-app
          namespace: beg-<< $id >>
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: beg-preview-app
        subjects:
          - kind: ServiceAccount
            name: beg-<< $id >>-app
            namespace: beg-previews
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: beg-preview-platform
          namespace: beg-<< $id >>
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: beg-preview-platform
        subjects:
          - kind: ServiceAccount
            name: beg-previews
            namespace: beg-previews
        ---
        # Clients dieser Preview: eigener SA, die Admission-Policy bindet Namen/Redirects an genau diese ID
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: beg-<< $id >>-keycloak
          namespace: keycloak
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: beg-preview-keycloak
        subjects:
          - kind: ServiceAccount
            name: beg-<< $id >>-keycloak
            namespace: beg-previews
        <<- end >>
    # 2. Secrets (Client-Secret abgeleitet, Registry-Pull kopiert) + Ressourcen-Grenzen des Namespace
    - name: secrets
      timeout: 2m
      resourcesTemplate: |
        <<- $id := "main" ->>
        <<- if eq inputs.kind "mr" ->><<- $id = printf "mr-%v" inputs.id ->><<- end ->>
        <<- if not (contains "[no-preview]" (default "" inputs.title)) >>
        <<- if lt (len "${PREVIEW_CLIENT_SECRET_SEED}") 32 >><<- fail "PREVIEW_CLIENT_SECRET_SEED fehlt oder ist kuerzer als 32 Zeichen (cluster-secrets)" >><<- end >>
        <<- $secret := printf "%s/%s" "${PREVIEW_CLIENT_SECRET_SEED}" $id | sha256sum >>
        apiVersion: v1
        kind: Secret
        metadata:
          name: beg-<< $id >>-crm-client
          namespace: keycloak
          labels:
            operator.keycloak.org/kind: KeycloakOIDCClient
            app.kubernetes.io/part-of: beg-preview
        type: Opaque
        stringData:
          client-secret: "<< $secret >>"
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: crm-client
          namespace: beg-<< $id >>
        type: Opaque
        stringData:
          client-secret: "<< $secret >>"
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: registry-pull
          namespace: beg-<< $id >>
          annotations:
            fluxcd.controlplane.io/copyFrom: "beg-previews/registry-pull"
        type: kubernetes.io/dockerconfigjson
        ---
        # Obergrenze einer Preview. Soll (Requests/Limits aus deployment/preview/app): ~1,2 CPU / 2,5 Gi angefordert,
        # ~4,5 CPU / 4,7 Gi Limit; Recreate-Rollouts, also keine Doppelbelegung. Etwas Luft fuer cert-manager-Solver.
        # Keine Services vom Typ LoadBalancer/NodePort (kostenpflichtiger Hetzner-LB bzw. offene Node-Ports).
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: beg-preview
          namespace: beg-<< $id >>
        spec:
          hard:
            requests.cpu: "2"
            requests.memory: 4Gi
            limits.cpu: "6"
            limits.memory: 6Gi
            pods: "10"
            services: "6"
            services.loadbalancers: "0"
            services.nodeports: "0"
            persistentvolumeclaims: "0"
        ---
        # Container ohne Angaben (z.B. cert-manager-Solver) bekommen Defaults, sonst lehnt die Quota sie ab
        apiVersion: v1
        kind: LimitRange
        metadata:
          name: beg-preview
          namespace: beg-<< $id >>
        spec:
          limits:
            - type: Container
              defaultRequest:
                cpu: 10m
                memory: 64Mi
              default:
                cpu: 500m
                memory: 256Mi
        <<- end >>
    # 3. Flux-Objekte: Quelle = MR-Commit, App + Keycloak-Clients aus deployment/preview/
    - name: flux
      timeout: 2m
      resourcesTemplate: |
        <<- $id := "main" ->>
        <<- if eq inputs.kind "mr" ->><<- $id = printf "mr-%v" inputs.id ->><<- end ->>
        <<- if not (contains "[no-preview]" (default "" inputs.title)) >>
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        metadata:
          name: beg-<< $id >>
          namespace: beg-previews
        spec:
          interval: 10m
          url: https://gitlab.com/einfach-genossenschaft/beg-verwaltung.git
          secretRef:
            name: gitlab-token
          ref:
            branch: << inputs.branch | quote >>
            commit: "<< inputs.sha >>"
          ignore: |
            /*
            !/deployment/preview
        ---
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: beg-<< $id >>-app
          namespace: beg-previews
          annotations:
            beg-preview/url: "https://beg-<< $id >>.hummler.com"
        spec:
          interval: 10m
          retryInterval: 1m
          timeout: 5m
          sourceRef:
            kind: GitRepository
            name: beg-<< $id >>
          path: ./deployment/preview/app
          targetNamespace: beg-<< $id >>
          serviceAccountName: beg-<< $id >>-app
          prune: true
          # Nicht auf Pods warten: das CI-Image kann noch fehlen (ImagePullBackOff loest sich selbst)
          wait: false
          # Plattform-Vorgaben, die MR-Manifeste nicht ueberschreiben koennen (Patches laufen nach deren Build)
          patches:
            - target:
                kind: Deployment
              patch: |
                - op: add
                  path: /spec/template/spec/priorityClassName
                  value: beg-preview
          postBuild:
            substitute:
              PREVIEW_ID: "<< $id >>"
              PREVIEW_SHA: "<< inputs.sha >>"
              PREVIEW_HOST: "beg-<< $id >>.hummler.com"
        ---
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: beg-<< $id >>-keycloak
          namespace: beg-previews
        spec:
          interval: 10m
          retryInterval: 1m
          timeout: 5m
          sourceRef:
            kind: GitRepository
            name: beg-<< $id >>
          path: ./deployment/preview/keycloak
          targetNamespace: keycloak
          serviceAccountName: beg-<< $id >>-keycloak
          prune: true
          wait: false
          postBuild:
            substitute:
              PREVIEW_ID: "<< $id >>"
              PREVIEW_SHA: "<< inputs.sha >>"
              PREVIEW_HOST: "beg-<< $id >>.hummler.com"
        <<- end >>
