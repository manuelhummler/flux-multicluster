apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CNPG-Cluster auf karibik, siehe docs/clusters/gitops-karibik.md, Phase 1.
namespace: cnpg-cluster
resources:
  - namespace.yaml
  - storageClass.yaml
  - cluster.yaml
  - database.yaml
  - networkPolicy.yaml
  - ../../base/ciliumNetworkPolicy
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # Barman-Ziel (DigitalOcean Space "hopps")
  - name: digitalocean-s3
    envs:
      - secrets/digitalocean-s3-encrypted.env
  # Rollen-Passwoerter (username/password). Dieselben Dateien werden spaeter in den
  # App-Overlays (keycloak, dtrack, vaultwarden, apicurio) als DB-Secret eingebunden.
  - name: apicurio-studio-secret
    type: kubernetes.io/basic-auth
    envs:
      - secrets/apicurio-studio-encrypted.env
  - name: apicurio-registry-secret
    type: kubernetes.io/basic-auth
    envs:
      - secrets/apicurio-registry-encrypted.env
  - name: keycloak-secret
    type: kubernetes.io/basic-auth
    envs:
      - secrets/keycloak-encrypted.env
  - name: dtrack-secret
    type: kubernetes.io/basic-auth
    envs:
      - secrets/dtrack-encrypted.env
  - name: vaultwarden-secret
    type: kubernetes.io/basic-auth
    envs:
      - secrets/vaultwarden-encrypted.env
