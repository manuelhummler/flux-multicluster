apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-prometheus
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: postgres-cluster
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.policy.serviceaccount: kube-prometheus-stack-prometheus
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-cloudnative-pg-operator
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: postgres-cluster
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.policy.serviceaccount: cloudnative-pg
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
            - port: "5432"
---
# Apps aus anderen Namespaces (keycloak, dtrack, vaultwarden, apicurio) erreichen Postgres
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-cluster
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: postgres-cluster
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "5432"
---
# Streaming Replication und Status-Abfragen zwischen den CNPG-Instanzen
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-replication-between-instances
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: postgres-cluster
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.policy.serviceaccount: postgres-cluster
  egress:
    - toEndpoints:
        - matchLabels:
            io.cilium.k8s.policy.serviceaccount: postgres-cluster
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-apiserver-from-postgres-cluster
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: postgres-cluster
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
---
# Barman: Backups und WAL-Archiv in den DigitalOcean Space (virtual-host- und path-style Hosts)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-digitalocean-spaces
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: postgres-cluster
  egress:
    - toFQDNs:
        - matchPattern: "*.digitaloceanspaces.com"
        - matchName: "fra1.digitaloceanspaces.com"
      toPorts:
        - ports:
            - port: "443"
