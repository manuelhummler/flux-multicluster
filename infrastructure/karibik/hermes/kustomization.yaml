apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Hermes Agent auf karibik (hermes.hummler.com), siehe docs/clusters/gitops-karibik.md, Abschnitt 4e.
namespace: hermes
resources:
  - ../../base/apps/hermes
  # Google-Workspace-Skill: OAuth-Client (Desktop-App) aus der Google Cloud Console, wird als Datei
  # nach /opt/data/google_client_secret.json gemountet (HelmRelease extraVolumes/extraVolumeMounts).
  - google-client-secret-encrypted.yaml
  # OneDrive-/SharePoint-Spiegel (Sidecars onedrive, office, familie im Hermes-Pod, Doku 4e "SharePoint/OneDrive"):
  # StorageClass mit 1 Replik ohne Backup-Gruppe und die gemeinsame Cache-PVC. Das HelmRelease (Base) haengt
  # beides ein.
  - storageClass.yaml
  - pvc-m365.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # Konfiguration der drei OneDrive-Clients, ein Key pro Sidecar: <name>.config (App-ID, Tenant, drive_id,
  # Optionen) und optional <name>.sync_list (Teilsynchronisation; Datei unter m365/ anlegen und hier als
  # weitere Zeile eintragen – jede Aenderung daran verlangt einmalig ONEDRIVE_RESYNC=1 am betroffenen
  # Sidecar, Rezept in der Doku). Keine Secrets darin. Ohne Suffix-Hash: die Sidecars lesen die Dateien nur
  # beim Start, Aenderung = rollout restart.
  # Skill m365-graph (Microsoft Graph: Dateien lesen, Mail lesen + Entwuerfe, Kalender; Doku 4e "Microsoft
  # Graph"): der Init-Container install-extras kopiert beide Dateien bei jedem Start nach
  # /opt/data/skills/productivity/m365-graph/. App-ID und Drive-IDs stehen im Skript, Token entsteht per Login.
  - name: m365-graph-skill
    files:
      - SKILL.md=m365-graph/SKILL.md
      - graph.py=m365-graph/graph.py
  - name: m365-sync
    files:
      - onedrive.config=m365/onedrive.config
      - onedrive.sync_list=m365/onedrive.sync_list
      - office.config=m365/office.config
      - familie.config=m365/familie.config
secretGenerator:
  # API-Key, Dashboard-Login, Telegram: alle Keys werden 1:1 Umgebungsvariablen im Pod (extraEnvFrom).
  # Name bewusst NICHT "hermes-env": so heisst das (leere) Env-Secret, das das Chart selbst rendert.
  - name: hermes-secrets
    envs:
      - hermes-env-encrypted.env
  # Bearer-Key der Hindsight-API (Doku 4g): dieselbe SOPS-Datei wie im Hindsight-Overlay, wird HINDSIGHT_API_KEY
  # im Pod (extraEnvFrom). Getrennt von hermes-env, damit der Key nur an einer Stelle gepflegt wird.
  - name: hermes-hindsight
    envs:
      - ../hindsight/hindsight-api-key-encrypted.env
