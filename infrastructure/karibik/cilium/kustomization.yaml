apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Eigenstaendiges Overlay (referenziert NICHT ../../base/apps/cilium):
# der Base ist auf captain-kube zugeschnitten (Hubble-UI/Relay, Prometheus,
# bandwidthManager, Namespace kube-system) und wuerde das laufende karibik-Cilium
# umkonfigurieren. Hier wird stattdessen das bestehende Release im Namespace
# `cilium` mit den Live-Values uebernommen.
resources:
  - ../../base/helm-repository/cilium.yaml
  - helm-release.yaml
