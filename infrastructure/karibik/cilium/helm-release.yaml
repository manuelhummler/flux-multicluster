apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  # Adoptiert das bestehende, out-of-band per Helm installierte Release.
  # releaseName + storageNamespace muessen exakt zum vorhandenen Release passen
  # (Namespace `cilium`, Release `cilium`), sonst zweite Parallelinstallation.
  releaseName: cilium
  storageNamespace: cilium
  targetNamespace: cilium
  interval: 5m
  install:
    createNamespace: false
  chart:
    spec:
      chart: cilium
      version: 1.19.5
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 60m
  # WICHTIG: Diese Values spiegeln exakt `helm -n cilium get values cilium`
  # (Stand 2026-10-31) wider, damit der erste Flux-Reconcile ein No-Op-Upgrade
  # ist und das CNI NICHT neu konfiguriert/ausgerollt wird.
  # Aenderungen hier rollen den cilium-DaemonSet neu aus -> mit Bedacht.
  values:
    cni:
      chainingMode: portmap
    hubble:
      tls:
        enabled: false
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList: 172.22.0.0/16
    k8sServiceHost: 142.132.246.190
    k8sServicePort: 6443
    kubeProxyReplacement: true
    operator:
      replicas: 1
