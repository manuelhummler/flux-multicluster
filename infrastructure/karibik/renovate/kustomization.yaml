apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renovate (self-hosted) auf karibik, siehe docs/clusters/gitops-karibik.md, Abschnitt 4f.
namespace: renovate
resources:
  - ../../base/apps/renovate
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # Tokens je Instanz; alle Keys werden 1:1 Umgebungsvariablen im Pod (existingSecret -> envFrom).
  - name: renovate-github-env
    envs:
      - renovate-github-env-encrypted.env
  - name: renovate-gitlab-env
    envs:
      - renovate-gitlab-env-encrypted.env
