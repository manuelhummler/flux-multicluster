# Realm "beg" fuer die Preview-Umgebungen (Doku 4j), einmaliger Import durch den Operator.
# ACHTUNG: KeycloakRealmImport wirkt nur beim ANLEGEN des Realms. Spaetere Aenderungen hier werden NICHT
# uebernommen - dann Realm in der Admin-Konsole anpassen oder (nur Previews betroffen) Realm loeschen und den
# Import per Neuanlage der CR wiederholen.
#
# Inhalt:
# - Realm-Rollen = Jmix-Rollen-Codes (jmix.oidc.default-claims-roles-mapper.roles-claim-name=roles) + portal-user
# - Gruppen <tenant>_member / <tenant>_admin / global_admin (KeyCloakService; Tenant der Previews = "preview")
# - KEINE eigenen clientScopes: sonst legt Keycloak die eingebauten (profile, email, roles, ...) nicht an.
#   Scope beg-roles (roles-Claim) und User-Profile-Policy setzt der Job realm-setup-job.yaml nach dem Import.
# - Client beg-e2e-admin (Service-Account, nur Nutzerverwaltung) fuer die E2E-Suite (Secret in der CI)
# - Client beg-preview-cleanup (Service-Account, Nutzer + Clients) nur fuer den Aufraeum-CronJob im Cluster
# - Feste Testnutzer = die ausgedachten Nutzer der Demo-Datenbank (Stand 20261111_104103), mit DENSELBEN IDs wie
#   beg_user.keycloak_id im Dump, damit der Login an die vorhandenen Jmix-Nutzer koppelt statt Duplikate zu
#   erzeugen. Konten mit realen Adressen aus dem Dump (@web.de, @beg-paf.de, @beg-in.de) bewusst NICHT
#   uebernommen. Passwort aller Testnutzer: Placeholder DEMO_PASSWORD (Secret beg-realm-placeholders).
#   demo@beg-verwaltung.de = CRM-Sachbearbeiter (Gruppe preview_admin), *@test.de = Mitglieder (preview_member).
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: beg
spec:
  keycloakCRName: beg
  placeholders:
    DEMO_PASSWORD:
      secret:
        name: beg-realm-placeholders
        key: demo-password
    E2E_ADMIN_SECRET:
      secret:
        name: beg-realm-placeholders
        key: e2e-admin-secret
    CLEANUP_SECRET:
      secret:
        name: beg-preview-cleanup
        key: client-secret
  realm:
    realm: beg
    enabled: true
    displayName: BEG (Preview)
    sslRequired: external
    registrationAllowed: false
    resetPasswordAllowed: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    roles:
      realm:
      - name: portal-user
      - name: admin
      - name: system-full-access
      - name: system-user-access
      - name: system-user-readonly
      - name: bpm-process-task-performer
    groups:
    - name: preview_member
      realmRoles:
      - portal-user
    - name: preview_admin
      realmRoles:
      - admin
      - system-full-access
      - bpm-process-task-performer
    - name: global_admin
      realmRoles:
      - admin
      - system-full-access
      - bpm-process-task-performer
    clients:
    - clientId: beg-e2e-admin
      name: BEG E2E admin (Testnutzer anlegen/loeschen)
      enabled: true
      publicClient: false
      secret: ${E2E_ADMIN_SECRET}
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
    - clientId: beg-preview-cleanup
      name: BEG Preview-Aufraeum-Job (Nutzer + verwaiste Clients)
      enabled: true
      publicClient: false
      secret: ${CLEANUP_SECRET}
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
    users:
    - id: 22c8ce2c-f102-46c2-bb54-5c3f06eeacf2
      username: demo@beg-verwaltung.de
      email: demo@beg-verwaltung.de
      firstName: Demovorname
      lastName: Demonachname
      enabled: true
      emailVerified: true
      credentials:
      - type: password
        value: ${DEMO_PASSWORD}
        temporary: false
      groups:
      - /preview_admin
    - id: 61a1f222-b3db-4007-9414-1d756d84377e
      username: peter.mueller@test.de
      email: peter.mueller@test.de
      firstName: Peter
      lastName: Müller
      enabled: true
      emailVerified: true
      credentials:
      - type: password
        value: ${DEMO_PASSWORD}
        temporary: false
      groups:
      - /preview_member
    - id: 16a390d5-e5d5-4938-a4a9-a59483cbcbfa
      username: heide.schmidt@test.de
      email: heide.schmidt@test.de
      firstName: Heide
      lastName: Schmidt
