apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/apps/cluster-issuer
patches:
  # HTTP-01-Solver als ClusterIP statt NodePort (cert-manager-Default): Traefik routet direkt auf die
  # Pod-Endpoints, ein NodePort waere nur zusaetzlich offen. Noetig fuer die Preview-Namespaces von beg-previews,
  # deren ResourceQuota services.nodeports=0 setzt (sonst bleibt die Challenge "pending").
  - target:
      kind: ClusterIssuer
      name: letsencrypt-prod
    patch: |
      - op: add
        path: /spec/acme/solvers/0/http01/ingress/serviceType
        value: ClusterIP
