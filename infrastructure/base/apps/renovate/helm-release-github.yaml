# Renovate (self-hosted) fuer GitHub: manuelhummler/flux-multicluster. Loest die Mend-Renovate-App ab.
# Entscheidungen und Betrieb: docs/clusters/gitops-karibik.md, Abschnitt 4f.
#
# CronJob, kein Webhook: Renovate laeuft stuendlich, prueft die Repos der festen Liste und oeffnet PRs.
# Repo-Konfiguration bleibt im Repo (renovate.json); hier steht nur die globale (Admin-)Konfiguration.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-github
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: renovate
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: renovate
      version: 46.422.2
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # Renovate braucht keinen Zugriff auf die Kubernetes-API. Das Chart kennt keinen Schalter dafuer
          # (serviceAccount.create: false -> SA "default" mit gemountetem Token).
          - target:
              kind: CronJob
            patch: |
              - op: add
                path: /spec/jobTemplate/spec/template/spec/automountServiceAccountToken
                value: false
  values:
    # CronJob, ConfigMap usw. heissen "renovate-github"; Pod-Label app.kubernetes.io/name bleibt "renovate"
    # (darauf matcht die CiliumNetworkPolicy).
    fullnameOverride: renovate-github

    # image.tag nicht setzen: Default = appVersion des Charts, Renovate bumpt Chart und Image gemeinsam.

    cronjob:
      # :05 jeder Stunde; GitLab laeuft um :35, damit sich die beiden Jobs nicht ueberlappen.
      schedule: "5 * * * *"
      timeZone: Europe/Berlin
      # Laeuft ein Lauf laenger als eine Stunde, wird der naechste uebersprungen statt parallel gestartet.
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 3000
      jobBackoffLimit: 1
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3

    renovate:
      # config.js statt config.json, damit Tokens aus Umgebungsvariablen (Secret) gelesen werden koennen
      # und nicht im Klartext in der ConfigMap stehen.
      configIsJavaScript: true
      config: |
        module.exports = {
          platform: 'github',
          // feste Liste, kein autodiscover
          repositories: ['manuelhummler/flux-multicluster'],
          // neue Repos bekommen erst einen Onboarding-PR; ohne renovate.json passiert nichts
          onboarding: true,
          requireConfig: 'required',
          // Commits ueber die GitHub-API: verifiziert, Autor = Besitzer des Tokens
          platformCommit: 'enabled',
          // fuer {{ secrets.GHCR_TOKEN }} in renovate.json (hostRule ghcr.io, privates Image fest-der-demokratie)
          secrets: {
            GHCR_TOKEN: process.env.GHCR_TOKEN,
          },
        };
      # --- Pod Security "restricted" (Container) ---
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]

    # RENOVATE_TOKEN (GitHub-PAT) und GHCR_TOKEN aus dem SOPS-Secret im Overlay (envFrom).
    existingSecret: renovate-github-env

    env:
      LOG_LEVEL: info

    # --- Pod Security "restricted" (Pod) ---
    # Das Image laeuft als UID 12021 (User "ubuntu" von containerbase). Root-FS bleibt beschreibbar:
    # containerbase installiert benoetigte Tools (node, helm, …) zur Laufzeit nach.
    securityContext:
      runAsNonRoot: true
      runAsUser: 12021
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
