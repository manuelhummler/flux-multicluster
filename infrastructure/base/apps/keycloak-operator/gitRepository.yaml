# Offizieller Keycloak Operator – es gibt kein Upstream-Helm-Chart, die Manifeste (CRDs + Deployment)
# liegen versioniert in keycloak/keycloak-k8s-resources. Gleiches Muster wie traefik-crds:
# GitRepository mit Tag + Flux-Kustomization auf ./kubernetes (dort liegt eine kustomization.yml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/keycloak/keycloak-k8s-resources
  ref:
    # Tag = Keycloak-Version (Operator und Server-Image sind gekoppelt)
    tag: 26.8.2
  # nur die Kubernetes-Manifeste, kein OpenShift/OLM
  ignore: |
    # exclude
    /*
    # include
    !/kubernetes
