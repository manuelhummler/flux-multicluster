# ServiceAccount fuer die Job-Pods: ohne API-Token, CI-Jobs bekommen keinen Zugriff auf die Kubernetes-API.
# (Der Runner-Manager selbst laeuft unter dem SA "gitlab-runner" aus dem Chart, mit Role nur in diesem Namespace.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-job
automountServiceAccountToken: false
---
# Niedrige Prioritaet fuer CI-Jobs: Wird es auf den Nodes eng, bleiben Job-Pods Pending bzw. werden zuerst
# verdraengt, statt dass Apps nicht mehr starten. preemptionPolicy Never: Jobs verdraengen selbst niemanden.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-low
value: -100
preemptionPolicy: Never
globalDefault: false
description: "GitLab-CI-Job-Pods (gitlab-runner): weichen Apps bei Ressourcenknappheit"
