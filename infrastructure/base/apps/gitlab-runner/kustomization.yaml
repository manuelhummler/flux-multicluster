apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitlab-runner
resources:
  - namespace.yaml
  - job-resources.yaml
  - networkPolicy.yaml
  - helm-release.yaml
  - ../../helm-repository/gitlab.yaml
  - ../../ciliumNetworkPolicy
configMapGenerator:
  # Gradle-Init-Skript fuer die Job-Pods (gemountet nach /gradle-home/init.d, siehe helm-release.yaml)
  - name: gradle-init
    files:
      - reposilite.gradle=gradle-init.gradle
generatorOptions:
  disableNameSuffixHash: true
