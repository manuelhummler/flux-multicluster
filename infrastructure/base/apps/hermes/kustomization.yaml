apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - networkPolicy.yaml
  - helm-release.yaml
  - ../../helm-repository/hermes-agent.yaml
  - ../../ciliumNetworkPolicy
  # HTTP-01-Solver von cert-manager muss hinter default-deny von Traefik erreichbar sein (8089)
  - ../../ciliumNetworkPolicy/allow-acme.yaml
