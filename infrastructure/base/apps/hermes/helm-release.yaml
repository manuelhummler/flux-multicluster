# Hermes Agent (KI-Harness von Nous Research) ueber das Community-Chart jyje/hermes-agent-helm.
# Entscheidungen und Betrieb: docs/clusters/gitops-karibik.md, Abschnitt 4e.
#
# Single-Writer-Workload: ein Pod, eine RWO-PVC unter /opt/data (Memory, Skills, SQLite-Sessions).
# Werte-Grundlage ist das values-hardened.yaml des Charts (Pod Security "restricted").
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1m0s
  # Image ~2,2 GB; der erste Start synchronisiert die gebuendelten Skills auf das Volume (Minuten).
  timeout: 15m0s
  chart:
    spec:
      chart: hermes-agent
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: hermes-agent
      version: 1.23.0
  install:
    # Beim Erst-Install wartet ein Mensch (Codex-Device-Login im Init-Container). helm-controller darf
    # darauf nicht warten: Nach 10 Minuten meldet das Deployment ProgressDeadlineExceeded, Helm bricht
    # mit "stalled resources" ab, deinstalliert und killt damit den laufenden Login (passiert 2026-11-08).
    # Upgrades warten weiterhin (Token liegt dann schon auf dem Volume).
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # Das Chart kennt kein progressDeadlineSeconds; Default 600 s reicht weder fuer den Login noch fuer den
          # Skills-Sync beim ersten Start.
          - target:
              kind: Deployment
              name: hermes
            patch: |
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 3600
          # HERMES_HOME muss UID 10000 gehoeren: Hermes prueft den Besitzer des Verzeichnisses, bevor die TUI
          # (Dashboard-Chat, `hermes chat`) den Control-Socket gateway.sock oeffnet (unsafe_control_path).
          # Die Wurzel des Longhorn-Volumes gehoert root (fsGroup setzt nur die Gruppe), chown ist unter PSS
          # restricted nicht moeglich. Daher: /opt/data = Unterverzeichnis "home" des Volumes (subPath), das ein
          # Init-Container als UID 10000 anlegt (Wurzel ist gruppenbeschreibbar + setgid). Strategic-Merge,
          # Container nach Namen, Mounts nach mountPath.
          - target:
              kind: Deployment
              name: hermes
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hermes
              spec:
                template:
                  spec:
                    initContainers:
                      - name: seed-config
                        volumeMounts:
                          - name: data
                            mountPath: /opt/data
                            subPath: home
                      - name: auth-device-login
                        volumeMounts:
                          - name: data
                            mountPath: /opt/data
                            subPath: home
                    containers:
                      - name: hermes-agent
                        volumeMounts:
                          - name: data
                            mountPath: /opt/data
                            subPath: home
          # Muss VOR seed-config laufen (sonst legt kubelet das subPath-Verzeichnis als root an): JSON-Patch an Index 0.
          - target:
              kind: Deployment
              name: hermes
            patch: |
              - op: add
                path: /spec/template/spec/initContainers/0
                value:
                  name: prepare-home
                  image: busybox:1.37
                  command: ["sh", "-c", "mkdir -p /pvc/home && chmod 700 /pvc/home && ls -ldn /pvc/home"]
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10000
                    runAsGroup: 10000
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                  volumeMounts:
                    - name: data
                      mountPath: /pvc
          # Python-Extras deklarativ: Init-Container "install-extras" als Kopie von seed-config (gleiches,
          # von Helm getemplatetes Image, gleicher securityContext, HERMES_HOME und data-Mount), nur Name und
          # Kommando ersetzt. `hermes pm install --extra ...` ist idempotent (realisierte Umgebung liegt unter
          # /opt/data/installs, Auswahl in facts.json); Fehler (PyPI offline) blockieren den Start nicht.
          # Zusaetzlich entsteht /opt/data/bin/python: Wrapper auf das Python der aktiven Umgebung mit
          # /opt/hermes im Modulpfad, damit Skill-Skripte (google-workspace) aus der Agenten-Shell laufen –
          # Hermes nimmt $HERMES_HOME/bin selbst in den Terminal-PATH auf.
          # Indizes nach den vorigen Patches: 0 prepare-home, 1 seed-config, 2 auth-device-login, 3 = Kopie.
          # Aendert das Chart die Init-Container, schlaegt dieser Patch laut fehl (HelmRelease nicht Ready).
          - target:
              kind: Deployment
              name: hermes
            patch: |
              - op: copy
                from: /spec/template/spec/initContainers/1
                path: /spec/template/spec/initContainers/-
              - op: replace
                path: /spec/template/spec/initContainers/3/name
                value: install-extras
              - op: add
                path: /spec/template/spec/initContainers/3/volumeMounts/-
                value:
                  name: tmp-tmpfs
                  mountPath: /tmp
              - op: replace
                path: /spec/template/spec/initContainers/3/command
                value:
                  - sh
                  - -c
                  - |
                    set -u
                    export HOME=/opt/data
                    echo "[install-extras] hermes pm install --extra google --extra stt-whisper"
                    if hermes pm install --extra google --extra stt-whisper; then
                      echo "[install-extras] Umgebung aktuell"
                    else
                      echo "[install-extras] WARNUNG: Installation fehlgeschlagen (offline?), Start geht weiter"
                    fi
                    VENV=$(/opt/hermes/.venv/bin/python -P - <<'PY'
                    import glob, json
                    for f in sorted(glob.glob("/opt/data/installs/*/facts.json")):
                        env = json.load(open(f)).get("packages", {}).get("venv", {}).get("environment")
                        if env:
                            print(env)
                            break
                    PY
                    )
                    [ -n "$VENV" ] || VENV=/opt/hermes/.venv
                    mkdir -p /opt/data/bin
                    printf '#!/bin/sh\n# Erzeugt vom Init-Container install-extras (HelmRelease hermes) - nicht editieren.\n# Python der aktiven Hermes-Umgebung + Hermes-Module, fuer Skill-Skripte aus der Agenten-Shell.\nexport PYTHONPATH="/opt/hermes${PYTHONPATH:+:$PYTHONPATH}"\nexec "%s/bin/python" "$@"\n' "$VENV" > /opt/data/bin/python
                    chmod 755 /opt/data/bin/python
                    ln -sf python /opt/data/bin/python3
                    echo "[install-extras] /opt/data/bin/python -> $VENV/bin/python"
                    # Das Terminal-Tool startet "bash -lic": Debians /etc/profile setzt dabei den PATH auf den
                    # Standard zurueck (ohne /opt/data/bin und /opt/hermes/bin). ~/.bash_profile wird danach
                    # gelesen und stellt beides voran. HOME des Hermes-Users ist /opt/data.
                    printf '# Erzeugt vom Init-Container install-extras (HelmRelease hermes) - nicht editieren.\n# Login-Shell des Terminal-Tools: Hermes-Python-Wrapper und hermes-CLI vor den Systempfaden.\nexport PATH="/opt/data/bin:/opt/hermes/bin:$PATH"\n[ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"\n' > /opt/data/.bash_profile
                    echo "[install-extras] /opt/data/.bash_profile geschrieben"
  values:
    # Ressourcen heissen damit schlicht "hermes" (Deployment, Service, ServiceAccount, PVC);
    # darauf verlassen sich die CiliumNetworkPolicies (io.cilium.k8s.policy.serviceaccount: hermes).
    fullnameOverride: hermes

    # image.tag leer = appVersion des Charts; Renovate bumpt Chart und damit das Image gemeinsam.
    image:
      repository: nousresearch/hermes-agent
      pullPolicy: IfNotPresent

    # Nicht-interaktiver Messaging-Gateway statt TUI; das Dashboard laeuft als eigener s6-Dienst im Pod.
    args: ["gateway", "run"]
    controller:
      type: deployment
    replicaCount: 1

    config:
      model:
        # ChatGPT-Abo per Codex-OAuth (kein API-Key). Modelle aus dem Codex-Katalog des Accounts;
        # gpt-6-luna ist laut Chart-Doku live verifiziert, Wechsel jederzeit per /model oder hier.
        provider: openai-codex
        default: gpt-6-luna
      terminal:
        # Shell-/Code-Ausfuehrung des Agenten laeuft IM Pod: der Pod ist die Sandbox
        # (restricted PSS, read-only Rootfs, kein SA-Token, Cilium default-deny).
        backend: local
      agent:
        gateway_timeout: 1800
      tools:
        # Nous-gehostete "Hosted Connectors" (Tool manage_connections, laeuft ueber das Nous-Portal) aus:
        # nicht genutzt, Egress dorthin ist zu, und der Agent griff sonst zu diesem Tool statt zum
        # Todoist-MCP und meldete "Connector-Dienst nicht erreichbar".
        connectors:
          enabled: false
      # Sprachnachrichten (Telegram) lokal transkribieren: faster-whisper im Pod, kein Cloud-Dienst.
      # faster-whisper ist nicht im Image, Hermes installiert es beim ersten Bedarf per uv nach
      # /opt/data/installs (Egress pypi.org/files.pythonhosted.org); das Modell kommt von huggingface.co
      # nach /opt/data/.cache/huggingface (~500 MB fuer "small"). Beides liegt auf der PVC.
      stt:
        enabled: true
        provider: local
        # leer = Sprache automatisch erkennen (deutsch und englisch gemischt)
        language: ""
        local:
          model: small
      # Remote-MCP-Server (landen 1:1 in config.yaml). Todoist: offizieller, von Todoist gehosteter MCP aus dem
      # Hermes-Katalog (/opt/hermes/optional-mcps/todoist), OAuth 2.1 mit Dynamic Client Registration gegen
      # todoist.com. Kein Secret in Git: das Token entsteht beim einmaligen "Connect" im Dashboard und liegt
      # danach auf der PVC unter /opt/data/mcp-tokens/todoist*.json. Ablauf in Doku 4e ("Todoist").
      mcp_servers:
        todoist:
          url: https://ai.todoist.net/mcp
          auth: oauth
          tools:
            # wie der Katalog: search/fetch sind die OpenAI-Connector-Kompatibilitaetsschicht (Duplikate der
            # find-*-Tools), Template-Import/-Export Nische
            exclude:
              - search
              - fetch
              - export-project-template
              - import-project-template

    # config.yaml auf dem Volume bei JEDEM Start aus diesem HelmRelease neu schreiben: Git ist die Wahrheit.
    # Laufzeit-Aenderungen (z. B. /model im Chat) ueberleben damit keinen Pod-Neustart – gewollt, siehe Doku 4e.
    bootstrap:
      enabled: true
      overwrite: true

    # Chart-Platzhalter entfernen; alle Secrets kommen aus hermes-secrets (extraEnvFrom, SOPS im Overlay).
    # Das Chart rendert selbst ein (dann leeres) Secret "hermes-env" – daher der andere Name.
    env:
      OPENAI_API_KEY: null
    extraEnvFrom:
      - secretRef:
          name: hermes-secrets
    extraEnv:
      # Whisper-Modelle klassisch ueber cdn-lfs*.huggingface.co laden statt ueber den Xet-Storage
      # (*.xethub.hf.co) – haelt die Egress-Policy auf *.huggingface.co beschraenkt.
      - name: HF_HUB_DISABLE_XET
        value: "1"

    # Codex-Device-Login beim Pod-Start (Init-Container auth-device-login, Hermes-Image):
    # holt einen Device-Code bei auth.openai.com, schickt URL + Code per Telegram (TELEGRAM_BOT_TOKEN +
    # TELEGRAM_HOME_CHANNEL aus hermes-secrets; steht zusaetzlich im Init-Container-Log) und wartet auf die
    # Bestaetigung. Refresh-Token landet in /opt/data/auth.json; bei spaeteren Starts wird nur validiert/
    # refresht, kein neuer Login. Siehe docs/clusters/gitops-karibik.md 4e.
    auth:
      deviceFlow:
        enabled: true
        provider: openai-codex
        notify: telegram
        # unter der ~15-Minuten-Gueltigkeit des Device-Codes; danach holt der Init-Container einen neuen
        timeoutSeconds: 870
        forceRelogin: false
        tokenOwner:
          uid: 10000
          gid: 10000
        # PSS restricted: gleiche UID wie der Agent (chown wird damit zum No-Op), keine Privilegien.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
    # Einzeiler "Gateway laeuft" per Telegram nach jedem Start (Kanal folgt auth.deviceFlow.notify).
    readyNotify:
      enabled: true

    dashboard:
      enabled: true
      # Externer Origin hinter Traefik (TLS endet dort). Wird beim ersten Seeden in config.yaml
      # geschrieben; Host spaeter aendern braucht einmalig bootstrap.overwrite: true.
      publicUrl: https://${HERMES_DOMAIN}
      # Traefik-Pods duerfen X-Forwarded-* setzen (Pod-Netz; Traefik laeuft ohne hostNetwork).
      trustedProxies:
        - 172.22.0.0/16
      auth:
        # Basic-Auth-Credentials (HERMES_DASHBOARD_BASIC_AUTH_*) liegen im Secret hermes-secrets,
        # das Chart kann sie nicht pruefen -> "external". Spaeter OIDC gegen Keycloak (Doku 4e).
        provider: external

    service:
      enabled: true
      type: ClusterIP
      port: 9119

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: ${HERMES_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: hermes-tls
          hosts:
            - ${HERMES_DOMAIN}

    persistence:
      enabled: true
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce
      # 5Gi waren nach Lazy-Install (2,3 GB venv unter installs/) + Whisper-Modell zu 65 % voll.
      # Longhorn erweitert online (allowVolumeExpansion), Verkleinern geht nicht.
      size: 10Gi
      mountPath: /opt/data
      # Volume (Memory, Skills, auth.json) ueberlebt helm uninstall / Install-Remediation; Helm adoptiert
      # die PVC beim naechsten Install wieder.
      annotations:
        helm.sh/resource-policy: keep

    # --- Pod Security "restricted" (aus values-hardened.yaml des Charts) ---
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
      fsGroup: 10000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    # s6-overlay braucht /run beschreibbar und ausfuehrbar, die Tools /tmp. Bewusst begrenzt (RAM-backed).
    extraVolumes:
      - name: run-tmpfs
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: tmp-tmpfs
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      # Google-Workspace-Skill: OAuth-Client-Secret (Overlay-Secret hermes-google-client, SOPS) als Datei
      # genau dort, wo das Skill sie erwartet. Das OAuth-Token google_token.json entsteht beim einmaligen
      # Login und bleibt auf dem Volume (Doku 4e, "Google Workspace").
      - name: google-client
        secret:
          secretName: hermes-google-client
          defaultMode: 0440
    extraVolumeMounts:
      - name: run-tmpfs
        mountPath: /run
      - name: tmp-tmpfs
        mountPath: /tmp
      - name: google-client
        mountPath: /opt/data/google_client_secret.json
        subPath: google_client_secret.json
        readOnly: true
    team:
      sharedVolume:
        permissions:
          enabled: false

    # Kubernetes-NetworkPolicy des Charts aus; wie ueberall im Repo CiliumNetworkPolicies (networkPolicy.yaml).
    networkPolicy:
      enabled: false
    serviceAccount:
      create: true
      automountServiceAccountToken: false

    # Chart-Test-Job (helm test) nicht rendern; Flux fuehrt keine Helm-Tests aus.
    tests:
      enabled: false

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
