# Cilium-Policies fuer Hermes. Grundlage: default-deny aus base/ciliumNetworkPolicy (alles zu ausser DNS).
# Egress bewusst minimal; Erweiterung Schritt fuer Schritt, Rezept in docs/clusters/gitops-karibik.md,
# Abschnitt 4e ("Egress erweitern"). Die Policies gelten fuer den ganzen Pod, also auch fuer Init-Container.

# Traefik -> Dashboard (HTTP, TLS endet bei Traefik)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-traefik
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.policy.serviceaccount: traefik
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "9119"
---
# Hermes -> OpenAI Codex (Provider openai-codex, ChatGPT-Abo per OAuth):
#   auth.openai.com  Device-Code-Login (Init-Container) und Token-Refresh (hermes_cli/auth_constants.py)
#   chatgpt.com      Inference-Backend /backend-api/codex und Usage-Probe
# Der DNS-Proxy kommt aus der default-deny-Regel der Base.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-openai-codex
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  egress:
    - toFQDNs:
        - matchName: auth.openai.com
        - matchName: chatgpt.com
      toPorts:
        - ports:
            - port: "443"
---
# Hermes -> Telegram Bot-API (Long Polling des Gateways, Device-Code-Zustellung des Init-Containers,
# Download von Sprachnachrichten)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-telegram
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  egress:
    - toFQDNs:
        - matchName: api.telegram.org
      toPorts:
        - ports:
            - port: "443"
---
# Lokale Sprach-Transkription (config.stt.provider: local): faster-whisper wird beim ersten Bedarf per uv
# von PyPI nachinstalliert, das Whisper-Modell von Hugging Face geladen. huggingface.co leitet die Dateien
# auf das CDN unter hf.co um (z. B. us.aws.cdn.hf.co, cdn-lfs-eu-1.hf.co); Ciliums "*" matcht nur ein
# Label, daher mehrere Pattern. Beides einmalig, landet auf der PVC.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-for-local-stt
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  egress:
    - toFQDNs:
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: huggingface.co
        - matchPattern: "*.huggingface.co"
        - matchName: hf.co
        - matchPattern: "*.hf.co"
        - matchPattern: "*.*.hf.co"
        - matchPattern: "*.*.*.hf.co"
      toPorts:
        - ports:
            - port: "443"
---
# Google-Workspace-Skill (Gmail, Calendar, Drive, Sheets, Docs, Contacts): OAuth-Einwilligung und Token-Refresh
# (accounts.google.com, oauth2.googleapis.com), Discovery und APIs (www.googleapis.com, <dienst>.googleapis.com).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-google-workspace
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  egress:
    - toFQDNs:
        - matchName: accounts.google.com
        - matchName: oauth2.googleapis.com
        - matchName: www.googleapis.com
        - matchPattern: "*.googleapis.com"
      toPorts:
        - ports:
            - port: "443"
---
# Todoist-MCP (config.mcp_servers.todoist): MCP-Endpunkt ai.todoist.net; OAuth-Server todoist.com fuer
# Dynamic Client Registration (/oauth/register), Token-Tausch und -Refresh (/oauth/access_token).
# Die Einwilligung selbst laeuft im Browser des Nutzers, der Callback kommt ueber Traefik ans Dashboard.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-todoist
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  egress:
    - toFQDNs:
        - matchName: ai.todoist.net
        - matchName: todoist.com
      toPorts:
        - ports:
            - port: "443"
---
# GitHub (Entscheidung 2026-11-11, Doku 4e "GitHub"): git ueber HTTPS und die REST-API fuer das github-Skill
# und den Skills-Hub (github.com, api.github.com, raw.githubusercontent.com), Archiv-/Release-Downloads
# (codeload.github.com, objects.githubusercontent.com) und die gh-CLI-Installation des Init-Containers
# (release-assets.githubusercontent.com). Damit ist nebenbei auch der Hermes-Modellkatalog (raw.githubusercontent.com)
# erreichbar.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-github
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
---
# GitLab (gitlab.com, Doku 4e "GitLab"): Remote-MCP (/api/v4/mcp), OAuth-Server (Dynamic Client Registration,
# Token-Tausch und -Refresh unter /oauth/*) und git ueber HTTPS – alles derselbe Host.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-to-gitlab
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: hermes
  egress:
    - toFQDNs:
        - matchName: gitlab.com
      toPorts:
        - ports:
            - port: "443"
---
# Noch NICHT freigegeben (bewusst): api.openai.com (nur fuer Provider openai-api noetig),
# hermes-agent.nousresearch.com (Modellkatalog, nur Komfort fuer /model), allgemeines Internet (Web-Tools des
# Agenten), kube-apiserver (kein SA-Token gemountet).
# Jede Erweiterung als eigene Policy hier ergaenzen.
