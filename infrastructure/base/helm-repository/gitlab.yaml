# Offizielle GitLab-Charts (u.a. gitlab-runner). Renovate bumpt die Chart-Version im HelmRelease (Flux-Manager);
# das Runner-Image haengt an der appVersion des Charts.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gitlab
  namespace: flux-system
spec:
  interval: 1h0m0s
  url: https://charts.gitlab.io
