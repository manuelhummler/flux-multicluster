# configs (cluster-secrets via SOPS) – MUSS zuerst laufen, liefert ${...} für substituteFrom
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/karibik/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# prometheus-operator-crds
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/karibik/prometheus-operator-crds
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-operator-crds
      namespace: flux-system
---
# cert-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
  path: ./infrastructure/karibik/cert-manager
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
---
# cluster-issuer (letsencrypt-prod) – braucht ${EMAIL} aus cluster-secrets
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-issuer
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
  path: ./infrastructure/karibik/cluster-issuer
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
---
# cilium – adoptiert das bestehende out-of-band Helm-Release (Namespace cilium, v1.19.5).
# Keine dependsOn/substituteFrom: das CNI laeuft bereits, Values sind im Overlay
# fest auf den Live-Stand gepinnt (No-Op-Uebernahme).
#
# Adoption am 2026-11-03 aktiviert (suspend: false). Davor war die Kustomization suspended,
# damit die CNI-Uebernahme nicht unbeaufsichtigt zusammen mit dem Auth-Fix feuert.
# Bei Problemen: suspend wieder auf true setzen; das out-of-band-Release bleibt bestehen.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  suspend: false
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/karibik/cilium
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: cilium
---
# metrics-server
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
  path: ./infrastructure/karibik/metrics-server
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: metrics-server
---
# longhorn – braucht ${DOMAIN} aus cluster-secrets
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
  path: ./infrastructure/karibik/longhorn
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
---
# traefik-crds-source (creates the GitRepository that pulls CRDs from the traefik-helm-chart)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-crds-source
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/karibik/traefik-crds
  prune: true
---
# traefik-crds (applies CRDs fetched via the traefik-crds GitRepository)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-crds
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik-crds-source
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: traefik-crds
  prune: true
---
# traefik
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
    - name: cert-manager
    - name: traefik-crds
  path: ./infrastructure/karibik/traefik
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik
---
# mariadb-operator (Phase 1) – Webhook-Zertifikat kommt von cert-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  timeout: 5m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
    - name: cert-manager
  path: ./infrastructure/karibik/mariadb-operator
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-operator
      namespace: mariadb-operator
---
# mariadb (Phase 1) – Galera 3 Replikate auf 2 Nodes, Backup nach DigitalOcean (kein MinIO)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb
  namespace: flux-system
spec:
  # Galera-Bootstrap mit 3 Pods und Longhorn-Volumes dauert einige Minuten
  timeout: 15m0s
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
    - name: longhorn
    - name: mariadb-operator
  path: ./infrastructure/karibik/mariadb
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      name: mariadb-galera
      namespace: mariadb
    - apiVersion: k8s.mariadb.com/v1alpha1
      kind: MaxScale
      name: maxscale-galera
      namespace: mariadb
